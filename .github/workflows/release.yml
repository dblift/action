name: release

on:
  release:
    types: [published]

# Prereleases (e.g. v4.0.0-rc1) never move the floating major tag: both jobs
# skip, leaving a neutral run instead of a red one.
jobs:
  test:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dblift
        run: pip install "dblift"

      - name: Run test suite
        run: bash tests/run.sh

  retag:
    if: ${{ !github.event.release.prerelease }}
    needs: test
    runs-on: ubuntu-latest
    # Only this job writes: it force-updates the major tag. The test job
    # installs from PyPI and runs repository test code, and has no business
    # holding a write-capable token.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive major version tag
        id: major
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag '${RELEASE_TAG}' does not look like a version (expected vX.Y.Z or X.Y.Z)" >&2
            exit 1
          fi

          major="${version%%.*}"
          echo "major_tag=v${major}" >> "$GITHUB_OUTPUT"

      - name: Force-update and push the major tag
        env:
          MAJOR_TAG: ${{ steps.major.outputs.major_tag }}
        run: |
          set -euo pipefail

          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "$MAJOR_TAG" --force
