name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dblift
        run: pip install "dblift"

      - name: Run test suite
        run: bash tests/run.sh

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy fixture project outside the repository root
        run: cp -r tests/fixtures/project "$RUNNER_TEMP/smoke-project"

      - name: Run dblift action
        id: dblift
        uses: ./
        with:
          command: check
          packages: dblift
          working-directory: ${{ runner.temp }}/smoke-project

      - name: Assert pending-count is exactly 0
        env:
          PENDING_COUNT: ${{ steps.dblift.outputs.pending-count }}
        run: |
          set -euo pipefail
          if [ "$PENDING_COUNT" != "0" ]; then
            echo "expected pending-count=0, got '${PENDING_COUNT}'" >&2
            exit 1
          fi

  action-smoke-postgres:
    runs-on: ubuntu-latest
    env:
      DBLIFT_DB_URL: postgresql+psycopg://dblift:dblift@localhost:5432/dblift
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dblift
          POSTGRES_PASSWORD: dblift
          POSTGRES_DB: dblift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dblift -d dblift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy fixture project outside the repository root
        run: cp -r tests/fixtures/project-postgres "$RUNNER_TEMP/smoke-project-postgres"

      - name: Run dblift action
        id: dblift
        uses: ./
        with:
          command: check
          extras: postgresql
          working-directory: ${{ runner.temp }}/smoke-project-postgres

      - name: Assert pending-count is exactly 0
        env:
          PENDING_COUNT: ${{ steps.dblift.outputs.pending-count }}
        run: |
          set -euo pipefail
          if [ "$PENDING_COUNT" != "0" ]; then
            echo "expected pending-count=0, got '${PENDING_COUNT}'" >&2
            exit 1
          fi
